# GoReleaser builds the release binaries. .github/workflows/release.yml runs
# it on every v* tag. See docs/releasing.md.
version: 2

project_name: rypt

builds:
  - id: rypt
    main: ./cmd/rypt
    binary: rypt
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # v-prefixed, like "make build" and "go install ...@v1.2.3".
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

# Plain binaries named like "make dist" names them: rypt-darwin-arm64,
# rypt-windows-amd64.exe, and so on.
archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

# A CycloneDX SBOM for each binary, named like it: rypt-linux-amd64.cdx.json
# and so on. Syft reads the Go version and the modules from the binary's
# build information, so the SBOM lists exactly what was compiled in.
sboms:
  - id: binaries
    artifacts: binary
    cmd: syft
    args: ["$artifact", "--output", "cyclonedx-json=$document", "--quiet"]
    documents:
      - "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}.cdx.json"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

# Sign the darwin binaries with the Developer ID Application certificate and
# notarize them with Apple. Without MACOS_SIGN_P12 (local and CI snapshots)
# this is skipped; the release workflow refuses to run without it.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [rypt]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

release:
  prerelease: auto # v1.2.0-rc.1 and the like are marked as pre-releases

# Writes Casks/rypt.rb in x6c-co/homebrew-tap, so that
# "brew install --cask x6c-co/tap/rypt" works on macOS and Linux.
# Pre-releases leave the tap alone.
homebrew_casks:
  - name: rypt
    description: Encrypt and decrypt files with envelope encryption using rypt.dev keys
    homepage: https://github.com/x6c-co/rypt-cli
    # "#{version}" is for Ruby, not GoReleaser: brew audit wants the cask's
    # version in its URLs.
    url:
      template: "https://github.com/x6c-co/rypt-cli/releases/download/v#{version}/{{ .ArtifactName }}"
    repository:
      owner: x6c-co
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "{{ .ProjectName }} {{ .Version }}"
    skip_upload: auto

changelog:
  sort: asc
